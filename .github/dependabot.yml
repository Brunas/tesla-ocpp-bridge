# Weekly dependency PRs. Minor and patch bumps come grouped into one PR per
# ecosystem; major bumps (e.g. ocpp 3.x, which changes the handler API) come
# alone so CI can show what breaks.
#
# No "docker" entry on purpose: for python:3.14-alpine the only update it can
# offer is a jump to a newer Python, which is a deliberate decision (see
# AGENTS.md). Base-image patches arrive through the weekly rebuild in build.yml.
version: 2
updates:
  # requirements-dev.txt includes addon/requirements.txt via -r, so "/" covers both.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
